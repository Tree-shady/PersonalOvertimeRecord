# Workflow A：每次 push / PR 自动构建，上传 APK 产物（Actions 页面可直接下载）
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 GitHub 页面手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 上提交的 gradlew 会丢失可执行位，这里确保 Linux 运行器能运行
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 自动缓存 ~/.gradle 与构建缓存，第二次起构建只需 1~2 分钟
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 注：若已配置签名 Secrets，debug 与 release 均用 release 签名打包
      #（debug 版可被 release 版直接覆盖升级，见 build.gradle.kts buildTypes.debug）；
      # 未配置 Secrets 时仍可正常出未签名包。
      - name: Build debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 把 APK 重命名为带版本号的名字（PersonalOvertimeRecord_v<版本>_<构建类型>.apk），
      # 便于在 Actions 下载页 / GitHub Release 中直接区分版本。
      # push 构建的 versionName = app/version.properties 的 BASE_VERSION。
      - name: Rename APKs with version
        run: |
          BASE_VERSION=$(sed -n 's/^BASE_VERSION=//p' app/version.properties)
          echo "Renaming APKs to PersonalOvertimeRecord_v${BASE_VERSION}_<buildType>.apk"
          count=0
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if [ "$count" = "1" ]; then
              mv "$f" "app/build/outputs/apk/debug/PersonalOvertimeRecord_v${BASE_VERSION}_debug.apk"
            else
              mv "$f" "app/build/outputs/apk/debug/PersonalOvertimeRecord_v${BASE_VERSION}_debug_${count}.apk"
            fi
          done
          count=0
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if [ "$count" = "1" ]; then
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_v${BASE_VERSION}_release.apk"
            else
              mv "$f" "app/build/outputs/apk/release/PersonalOvertimeRecord_v${BASE_VERSION}_release_${count}.apk"
            fi
          done
          echo "--- debug ---"; ls -1 app/build/outputs/apk/debug/
          echo "--- release ---"; ls -1 app/build/outputs/apk/release/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
