# Workflow B：打 tag（如 v1.3.0）时，用 GitHub Secrets 里的 keystore 签名，
# 并自动创建 GitHub Release 挂载 APK。
# 使用前需在仓库 Settings -> Secrets and variables -> Actions 添加：
#   KEYSTORE_BASE64   keystore 文件的 base64 内容
#   KEYSTORE_PASSWORD keystore 密码
#   KEY_ALIAS         别名（默认 overtime）
#   KEY_PASSWORD      密钥密码
name: Release

on:
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 / v1.3.0 这类 tag 时触发
  workflow_dispatch:

permissions:
  contents: write      # 允许创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 上提交的 gradlew 会丢失可执行位，这里确保 Linux 运行器能运行
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK from tag
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 兼容两种 tag 版本号格式：
          #   3 段 v1.3.0   -> versionCode 10300
          #   4 段 v0.1.4.1 -> versionCode 0010401 (即 10401)
          VERSION="${GITHUB_REF_NAME#v}"
          SEGS=$(echo "$VERSION" | awk -F. '{print NF}')
          if [ "$SEGS" = "3" ]; then
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          else
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d%02d", $1, $2, $3, $4}')
          fi
          echo "Building versionName=$VERSION versionCode=$CODE"
          ./gradlew assembleRelease \
            -PciVersionName="$VERSION" \
            -PciVersionCode="$CODE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
